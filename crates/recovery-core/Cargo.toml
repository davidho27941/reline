[package]
name = "recovery-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic LINE backup recovery engine: intake, analysis, transactional repair, payload re-encryption, verification."

[lib]
name = "recovery_core"
path = "src/lib.rs"

[features]
default = []
# Synthetic encrypted-backup and LINE database fixture generation. Used by tests and the CLI.
fixtures = ["rand"]

[dependencies]
